# Local development database. Spring Boot starts it automatically when the application runs.
# The credentials are for local use only and never used outside this machine.
services:
  postgres:
    image: 'postgres:18-alpine'
    environment:
      POSTGRES_DB: curiositas
      POSTGRES_USER: curiositas
      POSTGRES_PASSWORD: curiositas
    ports:
      # Fixed host port so tools like Metabase or a database client can connect.
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
